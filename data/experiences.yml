# Toutes les expériences, sans filtre. C'est la "source riche" : on met TOUT ici,
# les variantes (variants/*.yml) choisissent quoi afficher.
#
# Champs :
#   id          identifiant stable (utilisé par les variantes)
#   role        intitulé du poste
#   org         structure (optionnel)
#   location    (optionnel)
#   start / end AAAA ou AAAA-MM ; end: present pour "en cours"
#   summary     une phrase ou un court paragraphe
#   highlights  réalisations concrètes, chiffrées si possible
#   stack       technologies / outils
#   tags        thématiques pour filtrer (libres) : dev, lead, teaching, freelance…
#   angles      formulations alternatives des MÊMES faits, par angle (voir AGENTS.md) :
#                 lead      architecture, encadrement d'équipe
#                 teaching  pédagogie, formation d'adultes
#               Chaque angle ne redéfinit que les champs utiles (summary, highlights, stack…).
#
# "TODO" = information à confirmer ou compléter.
# Contenu FICTIF fourni en exemple : remplacez-le par vos propres expériences.

- id: atelier-numerique
  role: { fr: Lead développeuse, en: Lead developer }
  org: Atelier Numérique
  location: Lyon
  start: 2022-03
  end: present
  summary:
    fr: "Lead d'une équipe de cinq développeurs sur une plateforme de réservation utilisée par 200 salles de sport."
    en: "Leading a team of five developers on a booking platform used by 200 gyms."
  highlights:
    - fr: "Migration progressive d'un monolithe PHP vers Laravel, sans interruption de service."
      en: "Gradual migration of a PHP monolith to Laravel, with no service interruption."
    - fr: "Mise en place de la revue de code systématique et d'une CI qui exécute les tests à chaque merge request."
      en: "Introduced systematic code review and a CI running the test suite on every merge request."
    - fr: "Temps de chargement des pages de réservation divisé par trois."
      en: "Booking page load time cut by a factor of three."
  stack: [Laravel, PHP, Vue.js, PostgreSQL, Docker, GitLab CI]
  tags: [dev, lead]
  angles:
    lead:
      highlights:
        - fr: "Encadrement de cinq développeurs : revue de code, binômage, entretiens de progression."
        - fr: "Choix d'architecture et migration progressive d'un monolithe PHP vers Laravel, sans interruption de service."
        - fr: "Mise en place de la CI et des conventions d'équipe (tests, revues, documentation)."
    teaching:
      summary:
        fr: "Lead développeuse : j'accompagne au quotidien la montée en compétence de cinq développeurs, dont deux alternants."
      highlights:
        - fr: "Binômage et revues de code pensées comme des moments d'apprentissage."
        - fr: "Rédaction d'une documentation d'accueil qui réduit l'intégration d'un nouvel arrivant à une semaine."

